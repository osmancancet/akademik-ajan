[project]
name = "akademik-ajan"
version = "0.2.0"
description = "MCP server for academic work: citation verification via Crossref and OpenAlex."
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Osman Can Çetlenbik" }]
# Pinned on purpose: see docs/adr/0001-scope-and-principles.md
dependencies = [
    "mcp==2.3.0",
    "bibtexparser==1.4.3",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
akademik-ajan-mcp = "akademik_ajan.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/akademik_ajan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning:bibtexparser.*", "ignore:.*deprecated.*:DeprecationWarning"]
